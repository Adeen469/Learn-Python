# Fly.io config for Learn-Python (LP) — Next.js standalone server.
# Deploy from the dashboard (Machines -> Create a Machine -> GitHub repo)
# or with: fly deploy
# Secrets (dashboard or CLI, never in this file or in chat):
#   fly secrets set NEXT_PUBLIC_SUPABASE_URL=... NEXT_PUBLIC_SUPABASE_ANON_KEY=...
app = "learn-python-programming"
primary_region = "sin"

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

# Service-level HTTP health check (Fly docs: [[http_service.checks]] with
# grace_period / interval / method / path / timeout). Hits /api/health,
# which answers from the cached lesson fetch — no fresh DB ping per probe.
# A failing check takes the machine out of routing; it never restarts it.
[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/api/health"
  timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
