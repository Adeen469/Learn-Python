# fly.toml app configuration file generated for learnpython on 2026-11-16T07:14:38Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'learnpython'
primary_region = 'sin'

[build]
[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
