# Fly.io config for Learn-Python (LP) — Next.js standalone server.
# Deploy from the dashboard (Machines -> Create a Machine -> GitHub repo)
# or with: fly deploy
# Secrets (dashboard or CLI, never in this file or in chat):
#   fly secrets set NEXT_PUBLIC_SUPABASE_URL=... NEXT_PUBLIC_SUPABASE_ANON_KEY=...
app = "learn-python-programming"
primary_region = "sin"

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
